<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Improve responsiveness on mobile devices -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Search engine optimisation -->
    <meta
      name="description"
      content="Vitruvius provides enterprise‑grade AI and IT solutions, including automation, e‑commerce development, large language model integrations and custom website generation."
    />
    <title>Vitruvius | AI &amp; IT Solutions for Enterprises</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      referrerpolicy="no-referrer"
    />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <style>
      /* Animation definitions */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Generic fade‑in class with delays */
      .fade-in {
        opacity: 0;
      }
      .animate-fadeIn {
        animation: fadeIn 1s ease-out forwards;
      }
      .delay-1 {
        animation-delay: 0.2s;
      }
      .delay-2 {
        animation-delay: 0.4s;
      }
      .delay-3 {
        animation-delay: 0.6s;
      }
      .delay-4 {
        animation-delay: 0.8s;
      }

      .gradient-bg {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      }

      .service-card {
        transition: all 0.3s ease;
      }
      .service-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      /* Smooth scrolling behaviour */
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body class="font-sans antialiased text-gray-800 bg-gray-50">
    <!-- This is the old Vitruvius landing page - kept for reference -->
    <!-- The new React app is served from the main index.html -->
  </body>
</html>
